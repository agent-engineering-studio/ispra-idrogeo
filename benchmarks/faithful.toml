# Hand-labeled answers, written from the facts below, scored offline:
#     python -m benchmarks.faithful [--record | --check]
#
# Each answer has a class and the numbers a careful reader would flag:
# - faithful:    every number is in the facts, said of the right thing;
# - approximate: rounded the way a person would ("about 6.8 million");
# - question:    repeats a number of the question (passed as `question`);
# - rounded:     rounded the wrong way, or off by one;
# - invented:    a number no tool returned;
# - swapped:     a real number, said of the wrong thing.
# Only `swapped` needs check_claims: check_text sees a number that exists.
# One swap stays uncaught on purpose: "Bari ha 53 frane" uses Sarno's figure,
# and with two places in the facts the check cannot tell which one is meant.

