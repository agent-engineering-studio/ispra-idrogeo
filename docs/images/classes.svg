<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-label="The 7,899 municipalities by predisposition step, from the official share of land in hazard: landslide and flood">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#fcfcfb} .h{fill:#0b0b0b} .t2{fill:#52514e} .ax{fill:#7a7974} .grid{stroke:#e6e5e0;stroke-width:1}
  .chip{fill:#f0efec} .val{fill:#0b0b0b} .edge{stroke:#fcfcfb}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .h{fill:#f0efec} .t2{fill:#c3c2b7} .ax{fill:#8f8e88} .grid{stroke:#2e2e2b}
    .chip{fill:#2a2a28} .val{fill:#f0efec} .edge{stroke:#1a1a19}
  }
</style>
<rect class="bg" width="980" height="300" rx="14"/>
<text class="h" x="40" y="40" font-size="17" font-weight="700">The 7,899 municipalities by predisposition step (share of land in official hazard)</text>
<text class="h" x="186" y="106" font-size="14" font-weight="600" text-anchor="end">Landslide (P3+P4)</text>
<rect class="edge" x="200.0" y="80" width="188.4" height="40" fill="#d9d8d2" stroke-width="2"><title>Landslide (P3+P4), none: 2,126 municipalities</title></rect>
<text x="294.2" y="105" font-size="12" font-weight="600" text-anchor="middle" fill="#222222">2,126</text>
<rect class="edge" x="388.4" y="80" width="237.0" height="40" fill="#fee08b" stroke-width="2"><title>Landslide (P3+P4), low: 2,674 municipalities</title></rect>
<text x="506.9" y="105" font-size="12" font-weight="600" text-anchor="middle" fill="#222222">2,674</text>
<rect class="edge" x="625.4" y="80" width="134.6" height="40" fill="#fdae61" stroke-width="2"><title>Landslide (P3+P4), medium: 1,519 municipalities</title></rect>
<text x="692.7" y="105" font-size="12" font-weight="600" text-anchor="middle" fill="#222222">1,519</text>
<rect class="edge" x="760.0" y="80" width="82.1" height="40" fill="#f46d43" stroke-width="2"><title>Landslide (P3+P4), high: 926 municipalities</title></rect>
<text x="801.0" y="105" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">926</text>
<rect class="edge" x="842.0" y="80" width="58.0" height="40" fill="#a50026" stroke-width="2"><title>Landslide (P3+P4), very high: 654 municipalities</title></rect>
<text x="871.0" y="105" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">654</text>
<text class="h" x="186" y="176" font-size="14" font-weight="600" text-anchor="end">Flood (P2)</text>
<rect class="edge" x="200.0" y="150" width="114.2" height="40" fill="#d9d8d2" stroke-width="2"><title>Flood (P2), none: 1,289 municipalities</title></rect>
<text x="257.1" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#222222">1,289</text>
<rect class="edge" x="314.2" y="150" width="307.5" height="40" fill="#fee08b" stroke-width="2"><title>Flood (P2), low: 3,470 municipalities</title></rect>
<text x="468.0" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#222222">3,470</text>
<rect class="edge" x="621.7" y="150" width="156.3" height="40" fill="#fdae61" stroke-width="2"><title>Flood (P2), medium: 1,764 municipalities</title></rect>
<text x="699.9" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#222222">1,764</text>
<rect class="edge" x="778.1" y="150" width="68.6" height="40" fill="#f46d43" stroke-width="2"><title>Flood (P2), high: 774 municipalities</title></rect>
<text x="812.4" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">774</text>
<rect class="edge" x="846.7" y="150" width="53.3" height="40" fill="#a50026" stroke-width="2"><title>Flood (P2), very high: 602 municipalities</title></rect>
<text x="873.3" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">602</text>
<rect x="200" y="230" width="14" height="14" rx="3" fill="#d9d8d2"/>
<text class="t2" x="220" y="242" font-size="12">none (0%)</text>
<rect x="340" y="230" width="14" height="14" rx="3" fill="#fee08b"/>
<text class="t2" x="360" y="242" font-size="12">low (under 5%)</text>
<rect x="480" y="230" width="14" height="14" rx="3" fill="#fdae61"/>
<text class="t2" x="500" y="242" font-size="12">medium (5 to 15%)</text>
<rect x="620" y="230" width="14" height="14" rx="3" fill="#f46d43"/>
<text class="t2" x="640" y="242" font-size="12">high (15 to 30%)</text>
<rect x="760" y="230" width="14" height="14" rx="3" fill="#a50026"/>
<text class="t2" x="780" y="242" font-size="12">very high (30% or more)</text>
<text class="t2" x="40" y="274" font-size="13">A predisposition class from the hazard maps: it uses no rain and is not an alert.</text>
<text class="ax" x="40" y="291" font-size="11">Source: ISPRA IdroGEO risk indicators (CC BY 4.0), 22 November 2026; ispra_idrogeo.predisposition.</text>
</svg>
