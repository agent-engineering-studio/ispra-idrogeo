<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 458" role="img" aria-label="Download sizes for the whole of Italy, from 1.2 GB for the landslide hazard mosaic to 1 MB for events; the next run of an unchanged file costs one 304 answer">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#fcfcfb} .h{fill:#0b0b0b} .t2{fill:#52514e} .ax{fill:#7a7974} .grid{stroke:#e6e5e0;stroke-width:1}
  .chip{fill:#f0efec} .val{fill:#0b0b0b} .edge{stroke:#fcfcfb}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .h{fill:#f0efec} .t2{fill:#c3c2b7} .ax{fill:#8f8e88} .grid{stroke:#2e2e2b}
    .chip{fill:#2a2a28} .val{fill:#f0efec} .edge{stroke:#1a1a19}
  }
 .keep{fill:#2a78d6} @media (prefers-color-scheme: dark){ .keep{fill:#3987e5} }</style>
<rect class="bg" width="980" height="458" rx="14"/>
<text class="h" x="40" y="40" font-size="17" font-weight="700">First run: what each layer weighs for all of Italy (MB, zipped)</text>
<line class="grid" x1="340.0" y1="62" x2="340.0" y2="334"/>
<text class="ax" x="340.0" y="352" text-anchor="middle" font-size="11">0</text>
<line class="grid" x1="457.5" y1="62" x2="457.5" y2="334"/>
<text class="ax" x="457.5" y="352" text-anchor="middle" font-size="11">300</text>
<line class="grid" x1="575.0" y1="62" x2="575.0" y2="334"/>
<text class="ax" x="575.0" y="352" text-anchor="middle" font-size="11">600</text>
<line class="grid" x1="692.5" y1="62" x2="692.5" y2="334"/>
<text class="ax" x="692.5" y="352" text-anchor="middle" font-size="11">900</text>
<line class="grid" x1="810.0" y1="62" x2="810.0" y2="334"/>
<text class="ax" x="810.0" y="352" text-anchor="middle" font-size="11">1200</text>
<text class="t2" x="326" y="84" font-size="13" text-anchor="end">mosaic("pai_frane")  landslide hazard</text>
<rect x="340" y="66" width="470.0" height="24" rx="4" fill="#a3a29b"><title>mosaic("pai_frane")  landslide hazard: 1.2 GB</title></rect>
<text class="val" x="818.0" y="83" font-size="13" font-weight="600">1.2 GB</text>
<text class="t2" x="326" y="118" font-size="13" text-anchor="end">mosaic("idraulica")  flood hazard</text>
<rect x="340" y="100" width="293.8" height="24" rx="4" fill="#a3a29b"><title>mosaic("idraulica")  flood hazard: 750 MB</title></rect>
<text class="val" x="641.8" y="117" font-size="13" font-weight="600">750 MB</text>
<text class="t2" x="326" y="152" font-size="13" text-anchor="end">"frane_poly"  landslide polygons</text>
<rect x="340" y="134" width="224.4" height="24" rx="4" fill="#a3a29b"><title>"frane_poly"  landslide polygons: 573 MB</title></rect>
<text class="val" x="572.4" y="151" font-size="13" font-weight="600">573 MB</text>
<text class="t2" x="326" y="186" font-size="13" text-anchor="end">"aree_poly"  diffuse landslide areas</text>
<rect x="340" y="168" width="92.4" height="24" rx="4" fill="#a3a29b"><title>"aree_poly"  diffuse landslide areas: 236 MB</title></rect>
<text class="val" x="440.4" y="185" font-size="13" font-weight="600">236 MB</text>
<text class="t2" x="326" y="220" font-size="13" text-anchor="end">"frane_piff"  one point per landslide</text>
<rect x="340" y="202" width="14.9" height="24" rx="4" fill="#a3a29b"><title>"frane_piff"  one point per landslide: 38 MB</title></rect>
<text class="val" x="362.9" y="219" font-size="13" font-weight="600">38 MB</text>
<text class="t2" x="326" y="254" font-size="13" text-anchor="end">"frane_line"  narrow landslides</text>
<rect x="340" y="236" width="7.0" height="24" rx="4" fill="#a3a29b"><title>"frane_line"  narrow landslides: 18 MB</title></rect>
<text class="val" x="355.1" y="253" font-size="13" font-weight="600">18 MB</text>
<text class="t2" x="326" y="288" font-size="13" text-anchor="end">"dgpv_poly"  deep-seated deformations</text>
<rect x="340" y="270" width="2.0" height="24" rx="4" fill="#a3a29b"><title>"dgpv_poly"  deep-seated deformations: 4 MB</title></rect>
<text class="val" x="350.0" y="287" font-size="13" font-weight="600">4 MB</text>
<text class="t2" x="326" y="322" font-size="13" text-anchor="end">"eventi"  dated events</text>
<rect x="340" y="304" width="2.0" height="24" rx="4" fill="#a3a29b"><title>"eventi"  dated events: 1 MB</title></rect>
<text class="val" x="350.0" y="321" font-size="13" font-weight="600">1 MB</text>
<rect class="keep" x="40" y="382" width="10" height="56" rx="3"/>
<text class="h" x="64" y="404" font-size="15" font-weight="700">Every run after that: one "304 Not Modified" per file, a few hundred bytes.</text>
<text class="t2" x="64" y="428" font-size="14">ISPRA rebuilds the inventory files daily; only a file that really changed is downloaded and unpacked again.</text>
</svg>
