[project]
name = "ispra-idrogeo"
version = "0.5.0"
description = "Downloads and API client for ISPRA IdroGEO: IFFI landslide inventory, hazard mosaics and events, with a persistent conditional-GET cache"
readme = "README.md"
keywords = ["ispra", "idrogeo", "iffi", "landslide", "frane", "hazard", "pai", "flood", "italy", "gis"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
idrogeo = "ispra_idrogeo.cli:main"
idrogeo-mcp = "ispra_idrogeo.mcp_server:main"

[project.optional-dependencies]
# GeoDataFrames and GeoParquet: ispra_idrogeo.geo.
geo = [
    "geopandas>=1.0",
    "pyarrow>=15",
]
# A local DuckDB copy for spatial queries: ispra_idrogeo.warehouse.
warehouse = [
    "duckdb>=2.0",  # geometry_always_xy, CRS-typed geometries
]
# The idrogeo-mcp server for AI agents: ispra_idrogeo.mcp_server.
mcp = [
    "mcp>=2.0",  # MCPServer; FastMCP before 2.0
]

[project.urls]
Homepage = "https://github.com/agent-engineering-studio/ispra-idrogeo"
Issues = "https://github.com/agent-engineering-studio/ispra-idrogeo/issues"
Changelog = "https://github.com/agent-engineering-studio/ispra-idrogeo/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ispra-idrogeo[geo,mcp,warehouse]",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# geopandas and shapely ship no type information.
module = ["geopandas", "geopandas.*", "pandas", "pandas.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ispra_idrogeo"]

[tool.coverage.report]
fail_under = 90
show_missing = true
