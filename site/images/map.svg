<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 806" role="img" aria-label="Tile map of Italy's 20 regions coloured by IFFI landslides per 100 square km: Lombardia, Molise and Toscana are highest, Puglia and Sardegna lowest">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
