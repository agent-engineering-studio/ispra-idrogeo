<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 426" role="img" aria-label="IFFI landslides in Italy by type of movement: slides 237,419, slow earth flows 142,352, rapid debris flows 89,317">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
